[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "electromagnetic-state"
version = "0.1.0"
description = "电磁态频谱语义化工程：干扰功率谱合成 / 频谱分段拼接 / 语义参数频谱恢复"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Electromagnetic Team" },
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "h5py",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "mypy",
  "ruff",
  "black",
  "isort",
  "pre-commit",
]

[project.scripts]
spectrum-cli = "spectrum_cli:main"
spectrum-batch = "spectrum_batch:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

