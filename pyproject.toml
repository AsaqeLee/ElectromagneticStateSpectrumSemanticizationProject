[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "electromagnetic-state"
version = "0.2.0"
description = "电磁态频谱语义化工程：干扰功率谱合成 / 频谱分段拼接 / 语义参数频谱恢复"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Electromagnetic Team" },
]
dependencies = [
  "numpy>=1.20,<1.26",
  "scipy>=1.6,<1.11",
  "matplotlib>=3.5,<3.8",
  "pyyaml>=5.3",
  "h5py>=3.7,<3.12",
]

[project.optional-dependencies]
dev = [
  "pytest<9",
  "mypy",
  "ruff",
  "black<25",
  "isort",
  "pre-commit",
]

[project.scripts]
spectrum-cli = "spectrum_cli:main"
spectrum-batch = "spectrum_batch:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.8"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
src = ["src", "tests"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
